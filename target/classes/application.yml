server:
  port: 8080

spring:
  application:
    name: votacao
  datasource:
    url: jdbc:h2:file:./data/votacaodb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

votacao:
  sessao:
    duracao-padrao-segundos: 60
  associado-validador:
    # Ativado para validar a Tarefa Bônus 1
    habilitado: true
    base-url: https://user-info.herokuapp.com
  # URL base usada para montar os callbacks das telas do Anexo 1
  app-base-url: http://localhost:8080

logging:
  level:
    com.cooperativa.votacao: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html